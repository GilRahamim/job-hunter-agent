# Workday: from https://{tenant}.{wd}.myworkdayjobs.com/{site}
workday:
  - {tenant: intel, wd: wd1, site: External}
  - {tenant: nvidia, wd: wd5, site: NVIDIAExternalCareerSite}
  - {tenant: marvell, wd: wd1, site: MarvellCareers}

