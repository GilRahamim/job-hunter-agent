# Company career boards queried directly through their public ATS APIs.
# All of these were verified as live on 2026-10-13.
# Add a company: find its careers page — if the URL contains
#   boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>
#   or jobs.smartrecruiters.com/<slug>  → add <slug> under the matching ATS.
#   (jobs.eu.lever.co/<slug> goes under lever too: EU accounts are found automatically.)
# Run  python run_agent.py --check-companies  to validate the list.

greenhouse:
  - catonetworks
  - similarweb
  - wizinc
  - payoneer
  - appsflyer
  - taboola
  - jfrog
  - nice
  - gongio
  - transmitsecurity
  - via
  - melio
  - riskified
  - axonius
  - yotpo
  - torq
  - island
  - saltsecurity
  - forter
  - apiiro
  - safebreach
  - optimove
  - cymulate
  - orcasecurity
  - obligo
  - guardz
  - lightrun
  - bigid
  - datadog
