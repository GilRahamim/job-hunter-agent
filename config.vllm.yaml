# Local vLLM server for the scorer: free per call, so it can score more jobs per run and more of them at
# once. The smart agent stays on LM Studio's 27B model (config.yaml's `llm`): a 14B model that fits vLLM
# on a 16 GB GPU plans too weakly. Merged over config.yaml (only what differs is here).
# Tried 2026-10-22..25 and set aside: switching the one GPU between vLLM and LM Studio by hand meant
# the agent never ran. The default is now LM Studio for everything (config.yaml).
#
# Turn on:   add  JOBHUNTER_CONFIG=config.vllm.yaml  to .env   (remove the line to go back)
# Server:    bash scripts/vllm_serve.sh  in WSL2  (or Docker, see docs/LOCAL_LLM_AND_DOCKER.md)
# One GPU:   vLLM and LM Studio cannot both hold a 16 GB card. Regular runs: vLLM up, LM Studio model
#            unloaded. Agent runs (--agent): vLLM stopped, LM Studio model loaded; the agent scores its
#            own picks, so nothing calls vLLM.
#
# Scores from a local model are not on Claude Haiku's scale: check them with
# python scripts/agent_report.py before trusting agent.min_match_score / notify.min_score.

llm:
  provider: openai                      # vLLM serves the OpenAI API
  base_url: http://127.0.0.1:8000/v1    # not "localhost": on Windows it tries IPv6 first (+2 s per call)
  model: qwen3-local                    # --served-model-name in scripts/vllm_serve.sh
  max_tokens: 2048
  max_workers: 16                       # requests at once; vLLM batches them on the GPU (= --max-num-seqs)
  extra_body:
    chat_template_kwargs: {enable_thinking: false}    # scoring: the JSON answer, no reasoning first

matching:
  llm_top_n: 200                        # was 60: free locally, so more jobs get an LLM score per run
  min_prescore_for_llm: 10              # was 15

agent:
  scorer: agent                         # the agent's LM Studio model scores its picks: vLLM is down then
  llm:                                  # config.yaml's `llm` block (LM Studio), since `llm` above is vLLM now
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3.8-27b
    max_tokens: 8000
    max_workers: 4
    extra_body: {}                      # keep the scorer's "thinking off" out of the agent (llm.agent_llm_config
                                        # copies every `llm` key the agent block does not set)
