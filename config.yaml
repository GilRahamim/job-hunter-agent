# ============================================================
#  Job Hunter Agent – configuration
#  Edit this file, then run:  python run_agent.py
# ============================================================

profile:
  # Put your CV (PDF / DOCX / TXT) inside the cv/ folder.
  # The newest file in the folder is used automatically.
  cv_dir: cv
  # Language for the match explanations the LLM writes (he / en)
  explanation_language: he
  # Correct the CV extraction without editing the CV (optional)
  overrides:
    add_skills: []
    remove_skills: []
    # seniority: junior

filters:
  # Keep jobs located in Israel …
  israel: true
  # … and remote jobs that are open to candidates in Israel / EMEA / worldwide
  remote: true
  remote_regions_ok: [worldwide, anywhere, global, emea, europe, israel, "middle east", international]
  # Drop postings that state a years-of-experience requirement above this ("1+ years" is dropped at 0).
  # 0 = only jobs without an experience requirement; null = do not filter by years.
  max_required_years: 0
  # A title that says junior ("Junior Data Engineer, 1-2 years") may state up to this many years.
  junior_max_required_years: 0
  # true = drop postings with no description unless the title says junior (their experience
  # requirement cannot be checked: LinkedIn without fetch_linkedin_descriptions). false = keep them.
  drop_unverified: false
  # Words that mark a junior / entry-level job (title or description). Used by the filters,
  # the agent's searches and its save guard.
  junior_keywords: [junior, jr, "jr.", "entry level", "entry-level", graduate, "new grad", "recent grad",
                    "fresh graduate", graduates, student, intern, internship, trainee, apprentice,
                    "no experience", "no prior experience", "0-1 years", "0-2 years", "early career",
                    "ג'וניור", "גו'ניור", "ללא ניסיון", "ללא צורך בניסיון", "מתחיל", "מתחילה", "מתחילים",
                    "סטודנט", "בוגר", "בוגרת", "בוגרי", "התמחות", "משרת סטודנט"]
  # Description phrases that mean an experienced hire even when no number of years is given.
  # Ignored when the title says junior.
  experienced_phrases: ["extensive experience", "seasoned", "senior-level", "proven track record",
                        "proven experience", "deep experience", "significant experience",
                        "strong professional experience", "ניסיון רב", "ניסיון מוכח", "ניסיון משמעותי",
                        # Getro boards' seniority tags (VC portfolio jobs have no description)
                        "seniority: mid senior", "seniority: senior", "seniority: manager", "seniority: director",
                        "seniority: executive", "seniority: principal"]
  # Drop titles that are clearly above your level (set to false to keep them)
  exclude_senior: true
  senior_keywords: [experienced, "mid-level", "mid level", senior, "sr.", "sr ", staff, principal, lead, leader,
                    "head of", director, manager, architect, "vp ", chief, expert, ii, iii, iv,
                    "בכיר", "בכירה", "ראש צוות", "מנהל", "מנהלת", "מוביל", "מובילה", "ותיק"]
  # A job counts as a computer-science role when its title has one of `role_keywords`, OR its
  # description asks for one of `role_description_keywords` (a CS / engineering degree or a
  # technical background) - so "Test Driver for Autonomous Vehicles" asking for a B.Sc. counts too.
  role_description_keywords: ["computer science", "software engineering", "computer engineering",
                              "electrical engineering", "engineering degree", "degree in engineering",
                              "b.sc", "bsc", "b.s.", "technical background", "technical degree",
                              "stem", "מדעי המחשב", "הנדסת תוכנה", "הנדסת חשמל", "הנדסאי", "תואר טכני",
                              "רקע טכני", "תואר ראשון בהנדסה"]
  role_keywords:
    - engineering
    - " test"
    - validation
    - integration
    - frontend
    - front-end
    - front end
    - web
    - mobile
    - android
    - " ios"
    - embedded
    - firmware
    - cyber
    - security
    - " soc "
    - penetration
    - cloud
    - " sre "
    - "site reliability"
    - database
    - " dba "
    - " it "
    - "system administrator"
    - sysadmin
    - network
    - verification
    - game
    - סייבר
    - אבטחת מידע
    - מתכנת
    - מתכנתת
    - תכנות
    - מערכות מידע
    - developer
    - engineer
    - programmer
    - software
    - backend
    - back-end
    - full stack
    - fullstack
    - python
    - data scientist
    - data analyst
    - data engineer
    - analyst
    - machine learning
    - "ml "
    - " ai "
    - "ai "
    - genai
    - llm
    - forward deployed
    - forward deploy
    - " fde "
    - nlp
    - computer vision
    - algorithm
    - "bi "
    - automation
    - devops
    - "qa "
    - research
    - מפתח
    - מפתחת
    - מהנדס
    - מהנדסת
    - פיתוח
    - תוכנה
    - אנליסט
    - דאטה
    - אלגוריתם
  # Titles containing these are always dropped
  exclude_keywords: [sales, account executive, "customer success", recruiter, "talent acquisition", marketing, legal, counsel, accountant, "hr ", payroll, "office manager", nurse, "delivery driver", "truck driver", "bus driver", courier, "technician", guard, "מכירות", "גיוס"]
  # Ignore postings older than this (days). Sources that give no date are kept.
  max_age_days: 21

search:
  # Search terms used for LinkedIn / Indeed / Glassdoor / Google Jobs and remote boards
  # Junior wording finds entry-level roles; the experience filter drops any stated experience requirement.
  # Every query is one LinkedIn/Indeed pass (~15 s each): more queries = longer runs.
  queries:
    - Junior AI Engineer
    - Junior Machine Learning Engineer
    - Forward Deployed Engineer
    - Junior Python Developer
    - Junior Backend Developer
    - Junior Software Engineer
    - Entry Level Software Engineer
    - Graduate Software Engineer
    - Junior Data Scientist
    - Junior Data Analyst
    - Junior Data Engineer
    - Junior Full Stack Developer
    - Junior Algorithm Developer
    - Software Engineering Student
    - Junior Frontend Developer
    - Junior Mobile Developer
    - Junior Embedded Software Engineer
    - Junior Cyber Security Analyst
    - Junior DevOps Engineer
    - Junior QA Automation Engineer
    - Junior Cloud Engineer
    - Junior IT Support
    - Junior Validation Engineer
    - Test Engineer Student
  location: Israel
  results_per_query: 40
  hours_old: 168          # last 7 days

sources:
  techmap:                 # Israeli Tech Map daily job lists (github.com/mluggy/techmap, ODbL): ~470 Israeli
    enabled: true          # companies incl. ones without a public careers API; title/company/city only
    categories: [software, data-science, devops, frontend, hardware, qa, security, support]
  getro:                   # venture-capital portfolio job boards (Israel jobs only); id = the board's network id
    enabled: true
    boards:
      - {name: Israel VC Forum, id: 10949}          # israelvcforum.getro.com: ~880 companies of member funds
      - {name: Innovation Endeavors, id: 156}       # jobs.innovationendeavors.com
      # Aleph (jobs.aleph.vc): add once its network id is known. Open the board, and in the browser's
      # dev tools look for the request POST api.getro.com/api/v2/collections/<id>/search/jobs.
      # - {name: Aleph, id: <id>}
  jobspy:                  # LinkedIn, Indeed (Glassdoor has no Israel search; Google Jobs blocks scraping)
    enabled: true
    sites: [linkedin, indeed]
    fetch_linkedin_descriptions: false   # true = better matching but much slower
  company_boards:          # Greenhouse / Lever / Ashby / SmartRecruiters (companies.yaml)
    enabled: true
  remotive:
    enabled: true
  remoteok:
    enabled: true
  himalayas:
    enabled: true
  arbeitnow:
    enabled: true
  weworkremotely:
    enabled: true
  serpapi_google_jobs:     # Google Jobs: reaches AllJobs, Drushim, JobMaster pages; needs SERPAPI_API_KEY in .env
    enabled: true
    # Its own short list: every query is one SerpAPI search. The free plan has 250 searches a month,
    # so 8 queries x 30 daily runs = 240 (runs started from the dashboard count too).
    # Without this list, search.queries is used.
    queries:
      - מפתח תוכנה ג'וניור
      - פיתוח תוכנה ללא ניסיון
      - בוגר מדעי המחשב
      - אנליסט נתונים ג'וניור
      - Junior Software Engineer
      - Junior Python Developer
      - Junior AI Engineer
      - Junior Data Analyst

matching:
  # How many jobs (best pre-scores first) get a full LLM evaluation each run
  llm_top_n: 60
  # Jobs below this pre-score are never sent to the LLM
  min_prescore_for_llm: 15
  # Jobs that arrive without a description (LinkedIn, Tech Map) get it read from their LinkedIn page,
  # best pre-scores first, so the experience rules can be checked. ~2 s each; 0 = off.
  fetch_descriptions: 80
  # Re-score jobs already in the DB when your CV changes
  rescore_on_cv_change: true

agent:                     # tool-using agent loop:  python run_agent.py --agent
  goal_matches: 10         # stop after this many saved jobs scoring >= min_match_score
  min_match_score: 70
  max_steps: 50            # model turns per run (hard stop)
  max_searches: 20         # search_jobs calls per run: every role group once, then repeats
  max_searches_per_group: 3  # cap per role group, so one kind of job cannot use the whole budget
  # Kinds of jobs the agent must cover. Every group is searched before any group is repeated.
  # A query belongs to a group when its words match one of the group's titles.
  role_groups:
    AI / ML: [AI Engineer, GenAI Engineer, LLM Engineer, Machine Learning Engineer, NLP Engineer,
              Forward Deployed Engineer, FDE]
    Data: [Data Analyst, Data Scientist, Data Engineer, BI Developer, BI Analyst]
    Software: [Software Engineer, Junior Software Engineer, Python Developer, Backend Developer,
               Full Stack Developer, Java Developer, C++ Developer]
    Web / Mobile: [Frontend Developer, Web Developer, Mobile Developer, Android Developer, iOS Developer]
    Algorithms / Research: [Algorithm Developer, Algorithm Engineer, Computer Vision Engineer]
    Embedded / Hardware: [Embedded Software Engineer, Firmware Engineer, Verification Engineer]
    Cyber Security: [Cyber Security Analyst, Security Engineer, SOC Analyst, Penetration Tester]
    Automation / QA / DevOps: [Automation Engineer, QA Automation Engineer, DevOps Engineer,
                               Cloud Engineer, Site Reliability Engineer]
    IT / Systems: [IT Support, System Administrator, Network Engineer, Database Administrator]
    Testing / Validation / Field: [Test Engineer, Validation Engineer, Test Driver, Integration Engineer,
                                   Field Engineer, Technical Support Engineer, Application Engineer]
  results_per_search: 10   # results shown to the model per search
  # Guardrail: LinkedIn queries without a junior word get this prefix ("AI Engineer" -> "Junior AI Engineer")
  junior_query_prefix: Junior
  # Fetch LinkedIn descriptions for agent searches, so experience requirements can be checked
  fetch_linkedin_descriptions: true
  search_limit: 30         # LinkedIn/Indeed/Google results per agent query
  max_posting_chars: 3000  # posting text shown by read_posting
  sources: [linkedin, company_pages, remote_boards]
  # Model for the agent only (must support tool calling). Local LM Studio server (OpenAI-compatible);
  # `model` must be the identifier shown by `lms ls` / `lms load`. Use {} to use the `llm` section below.
  # Ollama instead:  llm: {provider: ollama, model: "qwen3:8b", num_ctx: 16384}
  llm:
    provider: openai
    base_url: http://127.0.0.1:1234/v1   # not "localhost": on Windows it tries IPv6 first (+2s per call)
    model: qwen/qwen3.6-35b-a3b   # LM Studio identifier (`lms ls`); alt: openai/gpt-oss-20b
    max_tokens: 8000         # Qwen thinks first; 4096 cut off profile extraction. Load with --context-length 32768

notify:                    # desktop notification after a run
  enabled: false
  min_score: 80            # announce new jobs scoring at least this

tailoring:                 # CV Tailoring Agent (second agent)
  master_cv: cv/cv_master.yaml
  template: cv/template.docx
  output_dir: data/tailored
  cover_letter: true
  pdf: false
  auto_min_score: null     # e.g. 80 = tailor new strong matches automatically after each run
  auto_max_per_run: 3
  max_verify_retries: 2

llm:
  # provider: anthropic | openai | google_genai | ollama | none
  # "none" = no LLM, heuristic scoring only (free, works offline)
  provider: anthropic
  model: claude-haiku-5-5
  temperature: 0
  max_workers: 6
  # Anthropic only: set when the API key is not scoped to a workspace (an ID, not a secret)
  anthropic_workspace_id: wrkspc_014GDNpoWdzWhuf7Zkkh15My
