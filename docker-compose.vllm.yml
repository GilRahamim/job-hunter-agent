# Adds a vLLM server (NVIDIA GPU) for the scorer and points the app at it; the smart agent stays on
# LM Studio on the host. One GPU: stop this service before an agent run (docs/LOCAL_LLM_AND_DOCKER.md).
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml up vllm   # only the server, for the app on Windows
# The first start downloads the model (~10 GB) into the hf-cache volume. Needs Docker Desktop with the
# WSL2 backend and an NVIDIA driver on Windows, or the NVIDIA Container Toolkit on Linux.
services:
  vllm:
    image: vllm/vllm-openai:v0.31.0                        # = the version in scripts/vllm_serve.sh
    entrypoint: ["bash", "/scripts/vllm_serve.sh"]          # the same settings as a WSL2 run
    environment:
      - HF_TOKEN=${HF_TOKEN:-}                              # only for gated models; Qwen3 is public
      # Tuning from the host shell, e.g. PowerShell  $env:KV_DTYPE="auto"  before `up`; empty = the
      # script's default (its ${VAR:-default} treats empty as unset)
      - MODEL=${MODEL:-}
      - MAX_LEN=${MAX_LEN:-}
      - KV_DTYPE=${KV_DTYPE:-}
      - GPU_UTIL=${GPU_UTIL:-}
      - MAX_SEQS=${MAX_SEQS:-}
    volumes:
      - ./scripts/vllm_serve.sh:/scripts/vllm_serve.sh:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    ipc: host                                               # PyTorch shared memory
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  app:
    environment:
      - JOBHUNTER_CONFIG=config.vllm.yaml,config.docker.yaml   # vLLM settings, reached at http://vllm:8000
    depends_on:
      - vllm

volumes:
  hf-cache:
