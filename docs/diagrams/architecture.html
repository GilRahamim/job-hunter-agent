  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

          letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.75rem; }
    h2 { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 400; margin: 2.75rem 0 0.35rem; }
    p.lede, p.note { color: var(--color-muted); font-size: 0.95rem; line-height: 1.55; max-width: 70ch; margin-bottom: 1rem; }
    p.note { font-family: var(--font-serif); font-style: italic; font-size: 1rem; margin: 0.75rem 0 0; }
    code { font-family: var(--font-mono); font-size: 0.82em; }
    .tag { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
            border: 1px dashed rgba(22,35,43,0.3); border-radius: 2px; padding: 1px 6px; margin-left: 0.5rem;
            vertical-align: middle; color: var(--color-muted); }
    svg { width: 100%; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0 !important; } }

    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Job Hunter Agent — the whole system</h1>
    <p class="lede">Everything runs locally on one Windows PC. The search agents collect and score postings into SQLite; the Streamlit dashboard reads it and is where applications are tracked. The LLM is optional throughout.</p>
